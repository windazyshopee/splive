<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coins/Min — Live Board</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#111213;
    --panel:#17181a;
    --line:#26282b;
    --orange:#ee4d2d;
    --amber:#ffce54;
    --text:#f2f2f0;
    --dim:#8a8d91;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 28px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:18px; margin:0; letter-spacing:0.02em; font-weight:700;}
  .brand .accent{color:var(--orange);}
  .status{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); font-family:var(--mono);}
  .dot{width:7px; height:7px; border-radius:50%; background:#3ecb6f; box-shadow:0 0 0 0 rgba(62,203,111,.6); animation:pulse 1.8s infinite;}
  .dot.off{background:#666; animation:none;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(62,203,111,.55);}
    70%{box-shadow:0 0 0 7px rgba(62,203,111,0);}
    100%{box-shadow:0 0 0 0 rgba(62,203,111,0);}
  }
  main{padding:20px 28px 60px;}
  .meta{display:flex; gap:22px; margin-bottom:16px; font-size:12px; color:var(--dim); font-family:var(--mono);}
  .meta b{color:var(--amber); font-weight:600;}
  table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--dim); padding:10px 14px; border-bottom:1px solid var(--line); font-weight:600;
  }
  th.num, .num{text-align:right;}
  th.center-col, .center-col{text-align:center;}
  th.link-col, .link-col{text-align:center;}
  tbody td{padding:10px 14px; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:13px;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  .rank{text-align:right; color:var(--dim);}
  .rate{color:var(--amber); font-weight:700;}
  td.user{font-family:var(--sans); font-size:13px;}
  .link-btn{
    display:inline-block; background:#232427; color:#5fb4ff; border:1px solid #3a3b3e; border-radius:6px;
    padding:4px 10px; font-size:11px; font-family:var(--sans); text-decoration:none;
  }
  .link-btn:hover{border-color:#5fb4ff;}
  .qr-btn{
    display:inline-block; background:#232427; color:#5fb4ff; border:1px solid #3a3b3e; border-radius:6px;
    padding:4px 10px; font-size:11px; font-family:var(--sans); cursor:pointer;
  }
  .qr-btn:hover{border-color:#5fb4ff;}
  .empty{padding:60px 20px; text-align:center; color:var(--dim); font-family:var(--mono); font-size:13px;}
  footer{padding:16px 28px 40px; font-size:11px; color:#5a5c60; font-family:var(--mono);}

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.65); display:none;
    align-items:center; justify-content:center; z-index:50;
  }
  .overlay.show{display:flex;}
  .qr-box{background:#1a1a1a; border:1px solid #444; border-radius:10px; padding:16px; text-align:center;}
  .qr-box img{display:block; margin:0 auto 10px; border-radius:6px; background:#fff;}
  .qr-box .url{color:#ccc; font:11px/1.4 var(--sans); word-break:break-all; max-width:240px; margin:0 auto 12px;}
  .qr-box button{background:var(--orange); color:#fff; border:none; border-radius:6px; padding:6px 18px; cursor:pointer; font-size:12px;}

  .table-scroll{
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    border:1px solid var(--line); border-radius:10px; background:var(--panel);
  }
  .table-scroll table{border:none; border-radius:0; background:none;}

  /* Keep rank visible as an anchor while scrolling horizontally on narrow screens */
  th.rank, td.rank{ position:sticky; left:0; background:var(--panel); z-index:1; }
  thead tr{ background:var(--panel); }
  tbody tr:hover td.rank{ background:#1c1d1f; }

  /* ---------- Mobile: same table, just tighter — no wrapping, no tall cards ---------- */
  @media (max-width: 720px) {
    header{ padding:16px 16px; flex-wrap:wrap; gap:8px; }
    .brand{ flex-wrap:wrap; gap:6px; }
    .brand h1{ font-size:16px; }
    .status{ font-size:11px; }
    main{ padding:14px 14px 40px; }
    .meta{ flex-wrap:wrap; row-gap:6px; column-gap:16px; font-size:11px; margin-bottom:14px; }

    table{ min-width:600px; } /* forces horizontal scroll instead of squishing/wrapping */
    thead th{ padding:8px 10px; font-size:10px; white-space:nowrap; }
    tbody td{ padding:8px 10px; font-size:12px; white-space:nowrap; }
    .link-btn{ padding:3px 8px; }
    .qr-col{ display:none; } /* QR only makes sense on non-mobile — link column covers mobile */
    .empty{ padding:40px 16px; }
    footer{ padding:14px 16px 30px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>coins<span class="accent">/</span>min</h1>
    <h1 style="font-weight:400; color:var(--dim); font-size:14px;">live board</h1>
  </div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">connecting…</span></div>
</header>

<main>
  <div class="meta">
    <div>tracking <b id="metaCount">0</b> item(s)</div>
    <div>window <b>5 min</b></div>
    <div>refreshed <b id="metaClock">—</b></div>
  </div>

  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th class="rank">#</th>
          <th class="link-col">URL</th>
          <th class="num">Coins/Min</th>
          <th class="num">Coins</th>
          <th class="num">Claims</th>
          <th>Username</th>
          <th class="center-col">Seen</th>
          <th>Last Caught</th>
          <th class="qr-col center-col">QR</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="empty" id="emptyState" style="display:none;">Chưa có dữ liệu — mở live.shopee.vn với userscript đang chạy.</div>
</main>

<footer>synced from Firebase Realtime Database</footer>

<div class="overlay" id="qrOverlay">
  <div class="qr-box">
    <img id="qrImg" width="240" height="240" alt="QR code">
    <div class="url" id="qrUrl"></div>
    <button id="qrClose">Close</button>
  </div>
</div>

<script>
  // ============================================================
  // FIREBASE CONFIG — lấy từ Firebase Console > Project settings
  // (đây là config public phía client, không phải secret — an toàn
  // để đưa vào file tĩnh, bảo mật thật sự nằm ở Realtime Database Rules)
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyBLWbg-g7VZMvDx4x-fyQGYcbVql5bCLQg",
    databaseURL: "https://shopee-live-36e26-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shopee-live-36e26"
  };

  const MAX_AGE_MS = 5 * 60 * 1000;

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const itemsRef = db.ref('items');

  const tbody = document.getElementById('tbody');
  const emptyState = document.getElementById('emptyState');
  const metaCount = document.getElementById('metaCount');
  const metaClock = document.getElementById('metaClock');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  let itemsCache = {};

  function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  itemsRef.on('value', snap => {
    itemsCache = snap.val() || {};
    statusDot.classList.remove('off');
    statusText.textContent = 'live';
    render();
  });

  db.ref('.info/connected').on('value', snap => {
    if (snap.val() === false) {
      statusDot.classList.add('off');
      statusText.textContent = 'reconnecting…';
    }
  });

  function render() {
    const now = Date.now();
    const rows = Object.entries(itemsCache)
      .map(([key, v]) => ({ key, ...v }))
      .filter(v => typeof v.lastCaught === 'number' && now - v.lastCaught <= MAX_AGE_MS)
      .sort((a, b) => {
        const pa = a.coinsPerMinute ?? -Infinity;
        const pb = b.coinsPerMinute ?? -Infinity;
        if (pb !== pa) return pb - pa;
        return b.lastCaught - a.lastCaught;
      });

    metaCount.textContent = rows.length;
    metaClock.textContent = new Date(now).toLocaleTimeString();
    emptyState.style.display = rows.length ? 'none' : 'block';

    tbody.innerHTML = rows.map((r, i) => {
      const timeStr = new Date(r.lastCaught).toLocaleTimeString();
      const perMinStr = r.coinsPerMinute != null ? Number(r.coinsPerMinute).toFixed(2) : '—';
      return `
        <tr>
          <td class="rank">${i + 1}</td>
          <td class="link-col">${r.share_url ? `<a class="link-btn" href="${esc(r.share_url)}" target="_blank" rel="noopener noreferrer">Mở</a>` : '—'}</td>
          <td class="num rate">${esc(perMinStr)}</td>
          <td class="num">${esc(r.coins_per_claim ?? '—')}</td>
          <td class="num">${esc(r.claims_per_session_per_viewer ?? '—')}</td>
          <td class="user">${esc(r.username ?? '—')}</td>
          <td class="center-col">${esc(r.seenCount ?? '—')}</td>
          <td>${esc(timeStr)}</td>
          <td class="qr-col center-col">${r.share_url ? `<button class="qr-btn" data-qr-url="${esc(r.share_url)}">QR</button>` : '—'}</td>
        </tr>
      `;
    }).join('');
  }

  // Re-render every 5s even without new pushes, so expired rows drop off.
  setInterval(render, 5000);

  // ---------- QR modal (desktop only column, but harmless if triggered anywhere) ----------
  const overlay = document.getElementById('qrOverlay');
  const qrImg = document.getElementById('qrImg');
  const qrUrl = document.getElementById('qrUrl');
  document.getElementById('qrClose').addEventListener('click', () => overlay.classList.remove('show'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('show'); });

  tbody.addEventListener('click', e => {
    const btn = e.target.closest('button[data-qr-url]');
    if (!btn) return;
    const url = btn.getAttribute('data-qr-url');
    if (!url) return;
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(url)}`;
    qrUrl.textContent = url;
    overlay.classList.add('show');
  });
</script>
</body>
</html>
